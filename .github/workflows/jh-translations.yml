name: JH Translations

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches:
      - dev
      - dev-jethub
      - master
      - master-jethub
    paths:
      - "**strings.json"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  WEBLATE_PROJECT: homeassistant
  WEBLATE_COMPONENT: core

jobs:
  upload:
    name: Upload
    if: github.repository_owner == 'jethome-homeassistant'
    runs-on: ${{ vars.RUNNER }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Prepare translations
        run: python3 -m script.jhtranslations upload

      - name: Resolve translation references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          from script.jhtranslations.develop import (
              flatten_translations,
              substitute_translation_references,
          )

          path = Path("build/translations-download/en.json")
          translations = json.loads(path.read_text())
          resolved = substitute_translation_references(
              translations, flatten_translations(translations)
          )
          path.write_text(json.dumps(resolved, indent=4, sort_keys=True))
          PY

      - name: Extract translations from upstream dev image
        run: |
          VERSION=$(curl -s https://version.home-assistant.io/dev.json | jq -r '.homeassistant."qemuarm-64"')
          docker create --platform linux/arm64 --name temp-core "ghcr.io/home-assistant/aarch64-homeassistant:$VERSION"
          docker cp temp-core:"/usr/src/homeassistant/homeassistant/components" build/upstream-components
          docker rm temp-core

      - name: Merge translations
        run: |
          python3 -m script.jhtranslations merge
          rm -rf build/upstream-components

      - name: Upload translations to Weblate
        env:
          WEBLATE_URL: ${{ secrets.WEBLATE_URL }}
          WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}
        run: |
          set -e
          # Map existing Weblate translations: filename -> language code
          curl -fsSL -H "Authorization: Token $WEBLATE_TOKEN" \
            "$WEBLATE_URL/api/components/$WEBLATE_PROJECT/$WEBLATE_COMPONENT/translations/?page_size=100" \
            -o /tmp/weblate-translations.json \
            || { echo "Weblate: failed to list translations, check WEBLATE_URL/WEBLATE_TOKEN and the component"; exit 1; }
          existing=$(jq -r 'if .results then .results[] | "\(.filename) \(.language.code)" else error("unexpected response") end' /tmp/weblate-translations.json)
          curl -fsSL -H "Authorization: Token $WEBLATE_TOKEN" \
            "$WEBLATE_URL/api/components/$WEBLATE_PROJECT/$WEBLATE_COMPONENT/" \
            -o /tmp/weblate-component.json \
            || { echo "Weblate: failed to get the component"; exit 1; }
          source_lang=$(jq -r '.source_language.code' /tmp/weblate-component.json)

          for f in build/translations-download/*.json; do
            lang=$(basename "$f" .json)
            echo "::group::$lang"
            code=$(printf '%s\n' "$existing" | awk -v file="$lang.json" '$1 == file {print $2}')
            if [ -z "$code" ]; then
              # New language: create the translation first
              code=${lang//-/_}
              for attempt in 1 2 3 4 5; do
                http=$(curl -sS -o /tmp/weblate-response.json -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Token $WEBLATE_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"language_code\": \"$code\"}" \
                  "$WEBLATE_URL/api/components/$WEBLATE_PROJECT/$WEBLATE_COMPONENT/translations/")
                if [ "$http" = "201" ] || [ "$http" = "409" ]; then
                  break
                fi
                if [ "$http" != "423" ] && [ "$http" != "429" ]; then
                  echo "Failed to add language $lang (HTTP $http)"
                  cat /tmp/weblate-response.json
                  exit 1
                fi
                echo "Component locked, retry in 30s (attempt $attempt)"
                sleep 30
              done
            fi
            # The source language translation is read-only, only method=source can update it
            upload_args=(-F "overwrite=1")
            if [ "$code" = "$source_lang" ]; then
              upload_args+=(-F "method=source")
            fi
            for attempt in 1 2 3 4 5; do
              http=$(curl -sS -o /tmp/weblate-response.json -w '%{http_code}' \
                -X POST \
                -H "Authorization: Token $WEBLATE_TOKEN" \
                -F "file=@$f" \
                "${upload_args[@]}" \
                "$WEBLATE_URL/api/translations/$WEBLATE_PROJECT/$WEBLATE_COMPONENT/$code/file/")
              if [ "$http" = "200" ]; then
                break
              fi
              if [ "$http" != "423" ] && [ "$http" != "429" ]; then
                echo "Upload of $lang failed (HTTP $http)"
                cat /tmp/weblate-response.json
                exit 1
              fi
              echo "Component locked, retry in 30s (attempt $attempt)"
              sleep 30
            done
            echo "::endgroup::"
          done
